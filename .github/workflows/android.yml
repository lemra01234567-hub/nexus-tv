name: Android TV APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK for public download
        run: cp app/build/outputs/apk/debug/app-debug.apk nexus-tv-v0.1.0-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-tv-test-debug-apk
          path: nexus-tv-v0.1.0-test.apk
      - name: Publish public GitHub prerelease after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-test nexus-tv-v0.1.0-test.apk --target "$GITHUB_SHA" --title "Nexus TV v0.1.0 compatibility test" --notes "ZTE Android TV 14 offline navigation test. Debug-signed development APK; test only. No Samsung TV firmware modification." --prerelease
